<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="The Unlikely Zionists">
  <link rel="canonical" href="https://kilejones.com/unlikely-zionists/group/">
  <title>group — The Unlikely Zionists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="group.css">
  <script src="../community-config.js" defer></script>
  <script src="../form-mail.js" defer></script>
  <script src="group.js" defer></script>
</head>
<body>
  <header class="group-header"><a href="../">The Unlikely Zionists</a><a href="../#community">Back</a></header>
  <main>
    <section class="group-layout" aria-labelledby="group-title">
      <div class="group-intro">
        <h1 id="group-title">group</h1>
        <p class="availability" id="availability" hidden><span class="availability-dot" aria-hidden="true"></span><span>live availability</span><output id="availability-value" aria-live="polite"></output></p>
        <div class="group-art" aria-hidden="true"><i></i><i></i></div>
      </div>
      <div class="group-entry">
        <form id="group-form">
          <div class="field"><label for="group-name">NAME</label><input id="group-name" name="name" autocomplete="name" maxlength="100" required></div>
          <div class="field"><label for="group-email">EMAIL</label><input id="group-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
          <label class="consent"><input type="checkbox" name="consent" required><span>I agree to be contacted by Unlikely Zionists.</span></label>
          <div class="honeypot" aria-hidden="true"><label for="group-website">Website</label><input id="group-website" name="website" tabindex="-1" autocomplete="off"></div>
          <button type="submit" id="group-submit" disabled>JOIN</button>
        </form>
        <p id="group-status" role="status" aria-live="polite"></p>
        <div id="group-room" hidden><a id="group-call" class="call-link" target="_blank" rel="noopener noreferrer">JOIN</a><button id="group-back" type="button">Back</button></div>
        <a class="contact" href="mailto:kilebardenjones@gmail.com">Contact</a>
      </div>
    </section>
  </main>
  <footer><a href="../">The Unlikely Zionists</a><a href="../#submit">Share your story</a></footer>
</body>
</html>
