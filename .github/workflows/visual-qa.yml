name: Personal Site Source QA
on:
  push:
    paths:
      - 'index.html'
      - 'script.js'
      - 'hero-webgl.js'
      - 'hero-gpu.js'
      - 'hero-object-worlds.js'
      - 'styles.css'
      - 'media.html'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'site.webmanifest'
      - 'assets/**'
      - 'og-image-v2.png'
      - 'icon-192-v2.png'
      - 'icon-512-v2.png'
      - 'apple-touch-icon-v2.png'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check hero script
        run: |
          node --check script.js
          node --check hero-webgl.js
          node --check hero-gpu.js
          node --check hero-object-worlds.js
      - name: Verify navigation, links and hero renderer
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const s=fs.readFileSync('script.js','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const gpu=fs.readFileSync('hero-webgl.js','utf8');
          const nav=h.substring(h.indexOf('<aside class="mobile-drawer"'),h.indexOf('</aside>'));
          for(const word of ['Inverted World','Unlikely Zio','Glossary','AZ Detector','Media']){
            if(!nav.includes(word))throw Error('Missing menu item: '+word);
          }
          if(nav.indexOf('Inverted World')>nav.indexOf('Unlikely Zio'))throw Error('Menu order');
          if(!nav.includes('https://kilejones.substack.com/subscribe'))throw Error('Wrong Substack destination');
          if(nav.includes('Projects') || h.includes('>Projects<'))throw Error('Projects must be removed from homepage navigation');
          for(const id of ['hero-canvas','menu-toggle','music-toggle','mobile-drawer']){
            if(!h.includes('id="'+id+'"'))throw Error('Missing '+id);
          }
          if(!h.includes('Kile Jones</h1>') || s.includes("fitFont(g, 'KILE B.'") || !s.includes('Bowlby One SC') || !s.includes("drawTrackedText(g,'KILE',0,yTop,tracking)") || !s.includes("drawTrackedText(g,'JONES',0,yBottom,tracking)") || !s.includes("state.mobile ? .86 : .74") || !s.includes("state.mobile ? .06 : .08") || !s.includes("g.textAlign='left'") || !s.includes("state.h * (state.mobile ? .30 : .42)"))
            throw Error('KILE / JONES wordmark missing');
          for(const file of ['assets/balloon-rabbit-v1.png','assets/matte-rhino-v1.png',
            'og-image-v2.png','icon-192-v2.png','icon-512-v2.png','apple-touch-icon-v2.png']){
            if(!fs.existsSync(file))throw Error('Missing figure or brand asset: '+file);
          }
          if(!h.includes('id="figures"') || !h.includes('figure-scene-rabbit') || !h.includes('figure-scene-rhino'))
            throw Error('Full-size figure gallery missing');
          for(const fn of ['drawFoilWorld','drawLiquidSilver','drawVideo','buildMask']){
            if(!s.includes('function '+fn+'('))throw Error('Renderer missing '+fn);
          }
          if(!css.includes('menu-word-enter'))throw Error('Menu reveal missing');
          if(!h.includes('src="hero-webgl.js') || !gpu.includes("getContext('webgl2'"))throw Error('GPU material stage missing');
          if(s.includes('function drawStars(') || s.includes('function drawStaircase('))throw Error('Rejected visuals still bundled');
          if(!gpu.includes('SIM_SIZE=256') || !gpu.includes('oldState'))throw Error('Fluid simulation missing');
          if(!gpu.includes('float opacity=mix(') || !gpu.includes('float feather=smoothstep('))throw Error('Liquid video reveal missing');
          if(!s.includes('drawFluidOverlay(') || !s.includes('document.fonts?.ready.then'))throw Error('Mask/compositing initialization missing');
          for(const font of ['Instrument+Sans','Archivo','Space+Grotesk','IBM+Plex+Sans']){
            if(!h.includes(font))throw Error('Missing hero trial font: '+font);
          }
          if(!h.includes('font-src'))throw Error('Font CSP missing');
          if(!s.includes('HERO_PROFILES') || !s.includes('nothin-final-refinement') || !s.includes('material:3'))throw Error('Run 9 final profile missing');
          if(!s.includes('requestedTry') || !s.includes(': 9'))throw Error('Run 9 must be production default');
          if(!s.includes('updateAdaptiveQuality') || !s.includes('qualityScale') || !s.includes('isIOS'))throw Error('Adaptive/iOS production governor missing');
          if(!s.includes('MIDNIGHT GLOSS') || !s.includes('SILVER FOIL'))throw Error('Material-world cycle missing');
          const world=fs.readFileSync('hero-object-worlds.js','utf8');
          const overlay=fs.readFileSync('hero-gpu.js','utf8');
          if(!world.includes('pointerSlow') || !world.includes('interactionMode>=7') || !world.includes('materialQuality>2.5') || !world.includes('Run 9 phone framing'))throw Error('Run 9 layered/material/mobile system missing');
          if(!world.includes('qualityScale') || !world.includes('antialias:!this.isIOS') || !world.includes('webglcontextrestored'))throw Error('3D adaptive/iOS recovery missing');
          if(!world.includes('prewarmMeshes') || !world.includes('ensureMesh'))throw Error('Lazy mesh first-paint optimization missing');
          if(!overlay.includes('updatePhysicalTransform') || !overlay.includes('speedBoost') || !overlay.includes('finalQ') || !overlay.includes('256'))throw Error('Run 9 GPU refinement missing');
          if(!overlay.includes('qualityScale') || !overlay.includes('webglcontextrestored') || !overlay.includes('this.isIOS'))throw Error('GPU adaptive/iOS recovery missing');
          if(!s.includes('HERO_TRY>=9){pointer.glyphHover=false;return;}'))throw Error('Production pixel-readback removal missing');
          if(!css.includes('.noise{display:none!important}'))throw Error('Mobile compositing cleanup missing');
          if(!h.includes('preload="metadata"') || !h.includes('cdn.creativeclaw.co" crossorigin'))throw Error('Production media loading optimization missing');
          if((nav.match(/<a /g)||[]).length!==5)throw Error('Navigation contains unapproved items');
          if(fs.existsSync('index (1).html'))throw Error('Obsolete Projects page must not return');
          const cname=fs.readFileSync('CNAME','utf8').trim();
          const robots=fs.readFileSync('robots.txt','utf8');
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const media=fs.readFileSync('media.html','utf8');
          if(cname!=='kilejones.com')throw Error('Production CNAME must remain kilejones.com');
          for(const [name,text] of [['index.html',h],['media.html',media],['robots.txt',robots],['sitemap.xml',sitemap]]){
            if(text.includes('kilebardenjones.com'))throw Error('Old domain leaked into '+name);
          }
          if(!h.includes('rel="canonical" href="https://kilejones.com/"'))throw Error('Homepage canonical incorrect');
          if(!media.includes('rel="canonical" href="https://kilejones.com/media.html"'))throw Error('Media canonical incorrect');
          if(!robots.includes('Sitemap: https://kilejones.com/sitemap.xml'))throw Error('Sitemap discovery missing');
          for(const url of ['https://kilejones.com/','https://kilejones.com/media.html']){
            if(!sitemap.includes('<loc>'+url+'</loc>'))throw Error('Sitemap missing '+url);
          }
                    console.log('Navigation, visual engine and accessibility selectors validated.');
          NODE
