name: Personal Site Source QA
on:
  push:
    paths:
      - 'index.html'
      - 'script.js'
      - 'hero-webgl.js'
      - 'hero-gpu.js'
      - 'hero-ink.js'
      - 'hero-art-plates.js'
      - 'styles.css'
      - 'media.html'
      - 'articles.html'
      - 'interviews.html'
      - 'writing.html'
      - 'media.css'
      - 'media.js'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'site.webmanifest'
      - 'assets/**'
      - 'og-image-v2.png'
      - 'icon-192-v2.png'
      - 'icon-512-v2.png'
      - 'apple-touch-icon-v2.png'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check hero script
        run: |
          node --check script.js
          node --check hero-webgl.js
          node --check hero-gpu.js
          node --check hero-ink.js
          node --check hero-art-plates.js
          node --check media.js
      - name: Verify navigation, links and hero renderer
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const s=fs.readFileSync('script.js','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const gpu=fs.readFileSync('hero-webgl.js','utf8');
          const nav=h.substring(h.indexOf('<aside class="mobile-drawer"'),h.indexOf('</aside>'));
          const expectedLinks = [
            'https://kilejones.substack.com/',
            'https://play.google.com/store/apps/details?id=com.kilejones.antizionismdetector',
            'https://kilejones-alt.github.io/TheAntizionistGlossary/',
            'media.html',
            'articles.html',
            'https://kilejones-alt.github.io/the-unlikely-zionists/'
          ];
          const menuLinks = Array.from(nav.matchAll(/<a href="([^"]+)"/g), match => match[1]);
          if (JSON.stringify(menuLinks) !== JSON.stringify(expectedLinks)) throw Error('Homepage menu destinations or order changed');
          if(nav.includes('Projects') || h.includes('>Projects<'))throw Error('Projects must be removed from homepage navigation');
          for(const id of ['hero-canvas','menu-toggle','music-toggle','mobile-drawer']){
            if(!h.includes('id="'+id+'"'))throw Error('Missing '+id);
          }
          if(!h.includes('Kile Jones</h1>') || s.includes("fitFont(g, 'KILE B.'") || !s.includes('Bowlby One SC') || !s.includes("drawTrackedText(g,'KILE',0,yTop,tracking)") || !s.includes("drawTrackedText(g,'JONES',0,yBottom,tracking)") || !s.includes("state.mobile ? .86 : .74") || !s.includes("state.mobile ? .06 : .08") || !s.includes("g.textAlign='left'") || !s.includes("state.h * (state.mobile ? .35 : .55)") || !s.includes("const lineGap = Math.min(size * .82"))
            throw Error('KILE / JONES wordmark missing');
          for(const file of ['assets/midnight-ceramic-v1.png','assets/balloon-rabbit-v1.png',
            'assets/amber-resin-v1.png','assets/matte-rhino-v1.png',
            'assets/folded-glass-v1.png','assets/silver-zio-v1.png',
            'assets/archival-film-v1.mp4','assets/archival-film-poster-v1.jpg',
            'assets/lenin-film-v1.mp4','assets/lenin-film-poster-v1.jpg',
            'og-image-v2.png','icon-192-v2.png','icon-512-v2.png','apple-touch-icon-v2.png']){
            if(!fs.existsSync(file))throw Error('Missing figure or brand asset: '+file);
          }
          if(h.includes('id="figures"') || h.includes('id="substack"') || h.includes('class="figure-scene') || h.includes('>Substack</a>'))
            throw Error('Removed homepage sections or duplicate Substack link returned');
          if(!nav.includes('>Inverted World</a>') || h.includes('class="detector-feature"') || h.includes('antizionistdetector.netlify.app'))
            throw Error('Homepage navigation or removed detector feature incorrect');
          for(const fn of ['drawFoilWorld','drawLiquidSilver','drawVideo','buildMask']){
            if(!s.includes('function '+fn+'('))throw Error('Renderer missing '+fn);
          }
          if(!css.includes('menu-word-enter'))throw Error('Menu reveal missing');
          if(!h.includes('src="hero-webgl.js') || !gpu.includes("getContext('webgl2'"))throw Error('GPU material stage missing');
          if(s.includes('function drawStars(') || s.includes('function drawStaircase('))throw Error('Rejected visuals still bundled');
          if(!gpu.includes('SIM_SIZE=256') || !gpu.includes('oldState'))throw Error('Fluid simulation missing');
          if(!gpu.includes('float opacity=mix(') || !gpu.includes('float feather=smoothstep('))throw Error('Liquid video reveal missing');
          if(!s.includes('drawFluidOverlay(') || !s.includes('document.fonts?.ready.then'))throw Error('Mask/compositing initialization missing');
          for(const font of ['Instrument+Sans','Archivo','Space+Grotesk','IBM+Plex+Sans']){
            if(!h.includes(font))throw Error('Missing hero trial font: '+font);
          }
          if(!h.includes('font-src'))throw Error('Font CSP missing');
          if(!s.includes('HERO_PROFILES') || !s.includes('nothin-final-refinement') || !s.includes('material:3'))throw Error('Run 9 final profile missing');
          if(!s.includes('requestedTry') || !s.includes(': 9'))throw Error('Run 9 must be production default');
          if(!s.includes('updateAdaptiveQuality') || !s.includes('qualityScale') || !s.includes('isIOS'))throw Error('Adaptive/iOS production governor missing');
          if(!s.includes('MIDNIGHT CERAMIC') || !s.includes('AMBER RESIN') || !s.includes('FOLDED GLASS') || !s.includes('SILVER FOIL'))throw Error('Material-world cycle missing');
          const plates=fs.readFileSync('hero-art-plates.js','utf8');
          const overlay=fs.readFileSync('hero-gpu.js','utf8');
          if(!h.includes('src="hero-art-plates.js') || h.includes('src="hero-object-worlds.js'))throw Error('Production art renderer incorrect');
          if(!h.includes('hero-art-plates.js?v=20261111lenin1') || !h.includes('hero-gpu.js?v=20261111lenin1') || !h.includes('hero-ink.js?v=20261124ink2') || !h.includes('script.js?v=20261124ink2'))throw Error('Production hero cache-buster stale');
          for(const file of ['midnight-ceramic-v1.png','amber-resin-v1.png','folded-glass-v1.png','silver-zio-v1.png'])
            if(!plates.includes(file))throw Error('Missing art plate: '+file);
          for(const file of ['archival-film-v1.mp4','lenin-film-v1.mp4'])
            if(!plates.includes(file))throw Error('Missing moving-image scene: '+file);
          if(s.includes('THE THIRD ERA FILM') || !s.includes('ARCHIVAL FOOTAGE') ||
             !plates.includes("document.createElement(scene.film ? 'video' : 'img')"))
            throw Error('Moving-image sequence missing');
          if(!overlay.includes('KBJArtPlates') || !plates.includes('pointer.nx'))throw Error('Art plate interaction missing');
          if(!overlay.includes('updatePhysicalTransform') || !overlay.includes('speedBoost') || !overlay.includes('finalQ') || !overlay.includes('256'))throw Error('Run 9 GPU refinement missing');
          if(!overlay.includes('qualityScale') || !overlay.includes('webglcontextrestored') || !overlay.includes('this.isIOS'))throw Error('GPU adaptive/iOS recovery missing');
          if(!s.includes('HERO_TRY>=9){pointer.glyphHover=false;return;}'))throw Error('Production pixel-readback removal missing');
          if(!css.includes('.noise{display:none!important}'))throw Error('Clean homepage must hide grain');
          if(!s.includes('const SHOW_MATERIALS = false') || !h.includes('preload="none"') || !h.includes('data-src="https://cdn.creativeclaw.co/'))throw Error('Material system must stay dormant and reversible');
          const ink=fs.readFileSync('hero-ink.js','utf8');
          if(!ink.includes('webglcontextrestored') || !ink.includes('uniform sampler2D mask') || !s.includes('window.KBJInkRenderer?.create'))throw Error('Responsive monochrome wordmark missing');
          if(h.includes('rel="preload" as="image"') || h.includes('rel="preconnect" href="https://cdn.creativeclaw.co"'))throw Error('Dormant hero art should not download');
          if(fs.existsSync('index (1).html'))throw Error('Obsolete Projects page must not return');
          const cname=fs.readFileSync('CNAME','utf8').trim();
          const robots=fs.readFileSync('robots.txt','utf8');
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const media=fs.readFileSync('media.html','utf8');
          const articles=fs.readFileSync('articles.html','utf8');
          const mediaCss=fs.readFileSync('media.css','utf8');
          const mediaJs=fs.readFileSync('media.js','utf8');
          if(cname!=='kilejones.com')throw Error('Production CNAME must remain kilejones.com');
          for(const [name,text] of [['index.html',h],['media.html',media],['articles.html',articles],['robots.txt',robots],['sitemap.xml',sitemap]]){
            if(text.includes('kilebardenjones.com'))throw Error('Old domain leaked into '+name);
          }
          if(!h.includes('rel="canonical" href="https://kilejones.com/"'))throw Error('Homepage canonical incorrect');
          if(!media.includes('rel="canonical" href="https://kilejones.com/media.html"'))throw Error('Media canonical incorrect');
          if(!articles.includes('rel="canonical" href="https://kilejones.com/articles.html"'))throw Error('Articles canonical incorrect');
          const interviews=fs.readFileSync('interviews.html','utf8');
          const writing=fs.readFileSync('writing.html','utf8');
          if(!media.includes('<title>Interviews & Podcasts — Kile Jones</title>') || (media.match(/class="reel /g)||[]).length!==10)throw Error('Interview queue missing');
          if(media.includes('href="interviews.html"'))throw Error('Redundant Interviews self-link');
          if(media.includes('id="articles"') || media.includes('Selected Articles') || !articles.includes('id="articles"') || !writing.includes('url=articles.html'))throw Error('Articles must be on their own page');
          if(fs.existsSync('projects.html') || media.includes('href="projects.html"') || interviews.includes('href="projects.html"'))throw Error('Projects destination still present');
          if(media.includes('Melissa Brodsky') || interviews.includes('Melissa Brodsky'))throw Error('Removed conversations still listed');
          if(!interviews.includes('History Impossible') || !interviews.includes('Lucy Tabrizi') || !interviews.includes('Jonah Platt') || !interviews.includes('Andrew Pessin'))throw Error('Interview archive incomplete');
          if(!articles.includes('Fathom Journal') || !articles.includes('MAZL') || !articles.includes('Philosophy Now') || !articles.includes('Routledge') || !articles.includes('Chomsky'))throw Error('Article selection incomplete');
          if(!articles.includes('media.css?v=20261124articles') || !articles.includes('media.js?v=20261124articles'))throw Error('Article asset versions stale');
          if(!mediaCss.includes('.articles-section') || !mediaJs.includes('IntersectionObserver') || !mediaJs.includes('5000'))throw Error('Media assets incomplete');
          const articleSection=articles.slice(articles.indexOf('id="articles"'));
          const writingUrls=[...articleSection.matchAll(/<h3><a href="(https?:\/\/[^"]+)"/g)].map(m=>m[1]);
          if((articleSection.match(/class="article-slide/g)||[]).length!==5 || writingUrls.length!==5 || new Set(writingUrls).size!==5)throw Error('Article queue entry count incorrect or duplicate');
          if(articleSection.includes('I Was Wrong About Israel') || articleSection.includes('Choose an article') || articleSection.includes('rotation-toggle'))throw Error('Removed article title or controls returned');
          if(!mediaJs.includes('article-deck') || !mediaJs.includes('pointerup') || !mediaCss.includes('.article-slide.is-leaving'))throw Error('Article motion missing');
          if(!robots.includes('Sitemap: https://kilejones.com/sitemap.xml'))throw Error('Sitemap discovery missing');
          for(const url of ['https://kilejones.com/','https://kilejones.com/media.html','https://kilejones.com/interviews.html','https://kilejones.com/articles.html']){
            if(!sitemap.includes('<loc>'+url+'</loc>'))throw Error('Sitemap missing '+url);
          }
          if(sitemap.includes('writing.html') || sitemap.includes('projects.html'))throw Error('Retired pages in sitemap');
                    console.log('Navigation, visual engine and accessibility selectors validated.');
          NODE

  articles:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the article carousel on desktop, laptop and phone
        run: |
          python3 -m http.server 8842 --bind 127.0.0.1 > /tmp/article-qa-server.log 2>&1 &
          node tests/article-carousel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-layouts
          path: qa-screenshots/articles-*.png
