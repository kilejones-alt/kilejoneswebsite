name: Homepage figure QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - 'hero-scenes.js'
      - 'script.js'
      - 'hero-gpu.js'
      - 'hero-object-worlds.js'
      - 'tests/site-preview.mjs'
      - '.github/workflows/wordmark-hover-qa.yml'
  pull_request:
    branches: [main]
jobs:
  interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: |
          node --check script.js
          node --check hero-gpu.js
          node --check hero-object-worlds.js
      - run: npm run check
      - run: npm run test:gpu
      - name: Test desktop and phone figure scenes and controls
        run: node tests/site-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-figure-qa
          path: qa-screenshots/
          if-no-files-found: ignore
