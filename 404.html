<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f3f5f7;color:#09090a;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
  </style>
</head>
<body>
<script>
(function(){
  var old=/^(www\.)?kilebardenjones\.com$/i.test(location.hostname);
  if(old){
    location.replace('https://kilejones.com'+location.pathname+location.search+location.hash);
    return;
  }
  location.replace('https://kilejones.com/');
})();
</script>
</body>
</html>
